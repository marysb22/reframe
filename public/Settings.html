<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Reframe MHS</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
--primary:#2E7D78;
--primary-light:#4D9794;
--primary-dark:#215E5A;
--bg:#F4F6F5;
--surface:#ffffff;
--surface-2:#FAFBFA;
--text:#16211F;
--muted:#5D6C6A;
--faint:#8B9997;
--border:#E4E9E7;
--danger:#B3372E;
--danger-bg:#FBEAE8;
--success:#1D7A4C;
--success-bg:#E4F5EA;
--radius-lg:22px;
--radius-md:14px;
--shadow-card:0 1px 2px rgba(15,27,30,.04), 0 8px 24px rgba(15,27,30,.06);
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;font-family:"Inter",Arial,sans-serif;background:var(--bg);color:var(--text);}
h1,h2{font-family:"Lexend","Inter",sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:40px 24px;}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:20px;}
.back-link:hover{color:var(--primary);}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
h1{font-size:22px;margin:0;}
.logout-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 15px;color:var(--muted);cursor:pointer;font-weight:600;font-size:12.5px;}
.logout-btn:hover{background:var(--danger-bg);color:var(--danger);border-color:#f3d3d0;}

.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-card);padding:26px;margin-bottom:18px;}
.card h2{font-size:15.5px;margin:0 0 4px;display:flex;align-items:center;gap:9px;}
.card h2 i{color:var(--primary);}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 18px;}

.account-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.account-row:last-child{border-bottom:none;}
.account-row span:first-child{color:var(--muted);}
.account-row span:last-child{font-weight:600;}

label{display:block;font-weight:600;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
label:first-of-type{margin-top:0;}
.input-wrap{position:relative;}
input{width:100%;height:44px;border-radius:11px;border:1.5px solid var(--border);padding:0 42px 0 14px;font-size:13.5px;background:var(--surface-2);}
input:focus{outline:none;border-color:var(--primary-light);background:var(--surface);}
.toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;}
.field-hint{font-size:11px;color:var(--faint);margin-top:5px;}
.msg{padding:11px 14px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:none;}
.msg.error{background:var(--danger-bg);color:var(--danger);display:block;}
.msg.success{background:var(--success-bg);color:var(--success);display:block;}
button.submit{margin-top:20px;height:44px;padding:0 22px;border:none;border-radius:11px;background:var(--primary);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}
button.submit:hover{background:var(--primary-dark);}
button.submit:disabled{opacity:.6;cursor:not-allowed;}
</style>
</head>
<body>
<div class="wrap">
<a class="back-link" id="backLink" href="#"><i class="fa fa-arrow-left"></i> Back to dashboard</a>

<div class="header-row">
<h1>Settings</h1>
<button class="logout-btn" onclick="logout()">Log out</button>
</div>

<div class="card">
<h2><i class="fa fa-id-card"></i>Account</h2>
<p class="hint">Your account details.</p>
<div class="account-row"><span>Full name</span><span id="accName">&mdash;</span></div>
<div class="account-row"><span>ID</span><span id="accId">&mdash;</span></div>
<div class="account-row"><span>Role</span><span id="accRole">&mdash;</span></div>
</div>

<div class="card">
<h2><i class="fa fa-lock"></i>Change password</h2>
<p class="hint">This is the only place you can change your password. You'll need your current password.</p>

<div id="msgBox" class="msg"></div>

<form id="changeForm">
<label>Current password</label>
<div class="input-wrap">
<input type="password" id="currentPassword" required autocomplete="current-password">
<button type="button" class="toggle-eye" onclick="toggleField('currentPassword', this)"><i class="fa fa-eye"></i></button>
</div>

<label>New password</label>
<div class="input-wrap">
<input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
<button type="button" class="toggle-eye" onclick="toggleField('newPassword', this)"><i class="fa fa-eye"></i></button>
</div>
<div class="field-hint">At least 8 characters.</div>

<label>Confirm new password</label>
<div class="input-wrap">
<input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
<button type="button" class="toggle-eye" onclick="toggleField('confirmPassword', this)"><i class="fa fa-eye"></i></button>
</div>

<button type="submit" class="submit" id="submitBtn">Update password</button>
</form>
</div>

</div>

<script>
const API = "http://localhost:3000/api";
const token = localStorage.getItem("token") || localStorage.getItem("reframe_token");
if (!token) window.location.href = "login.html";

function destinationForRole(role) {
  if (role === "admin") return "AdminDashboard.html";
  if (role === "supervisor") return "supervisor-dashboard.html";
  return "PersonalProfile.html";
}

function toggleField(id, btn) {
  const el = document.getElementById(id);
  const icon = btn.querySelector("i");
  if (el.type === "password") { el.type = "text"; icon.className = "fa fa-eye-slash"; }
  else { el.type = "password"; icon.className = "fa fa-eye"; }
}

function showMsg(text, type) {
  const box = document.getElementById("msgBox");
  box.textContent = text;
  box.className = "msg " + type;
}

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("reframe_token");
  localStorage.removeItem("reframe_user");
  localStorage.removeItem("user");
  window.location.href = "login.html";
}

async function loadMe() {
  try {
    const res = await fetch(API + "/profile/me", { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 401) { window.location.href = "login.html"; return; }
    const data = await res.json();

    // If a first-login password change is still pending, that has to happen
    // on the dedicated page first -- Settings is for voluntary changes only.
    if (data.must_change_password) {
      window.location.href = "change-password.html";
      return;
    }

    document.getElementById("accName").textContent = data.full_name;
    document.getElementById("accId").textContent = data.memberCode;
    document.getElementById("accRole").textContent = data.role.charAt(0).toUpperCase() + data.role.slice(1);
    document.getElementById("backLink").href = destinationForRole(data.role);
  } catch (err) {
    showMsg("Could not reach the server. Make sure the backend is running on port 3000.", "error");
  }
}

document.getElementById("changeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById("currentPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (newPassword !== confirmPassword) {
    showMsg("New password and confirmation don't match.", "error");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Saving...";

  try {
    const res = await fetch(API + "/profile/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    const data = await res.json().catch(() => null);

    if (!res.ok) {
      showMsg(data?.error || "Could not change password.", "error");
    } else {
      showMsg("Password updated.", "success");
      document.getElementById("changeForm").reset();
    }
  } catch (err) {
    showMsg("Could not reach the server. Make sure the backend is running on port 3000.", "error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Update password";
  }
});

loadMe();
</script>
</body>
</html>
