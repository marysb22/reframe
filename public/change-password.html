<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a New Password | Reframe MHS</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
--primary:#2E7D78;
--primary-light:#4D9794;
--primary-dark:#215E5A;
--bg:#F4F6F5;
--surface:#ffffff;
--surface-2:#FAFBFA;
--text:#16211F;
--muted:#5D6C6A;
--faint:#8B9997;
--border:#E4E9E7;
--danger:#B3372E;
--danger-bg:#FBEAE8;
--success:#1D7A4C;
--success-bg:#E4F5EA;
--shadow-pop:0 20px 60px rgba(15,27,30,.14);
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;font-family:"Inter",Arial,sans-serif;background:linear-gradient(160deg,#F4F6F5,#E7EEEC);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;}
h1,h2{font-family:"Lexend","Inter",sans-serif;}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-pop);padding:38px 34px;width:100%;max-width:440px;}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--primary-light),var(--primary));display:grid;place-items:center;color:#fff;font-family:"Lexend";font-weight:700;font-size:17px;margin-bottom:18px;}
h1{font-size:21px;margin:0 0 6px;font-weight:700;}
.subtitle{color:var(--muted);font-size:13.5px;margin:0 0 26px;line-height:1.5;}
.user-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:30px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:22px;}
.user-chip strong{color:var(--text);}
label{display:block;font-weight:600;font-size:12.5px;color:var(--muted);margin:16px 0 6px;}
label:first-of-type{margin-top:0;}
.input-wrap{position:relative;}
input{width:100%;height:46px;border-radius:11px;border:1.5px solid var(--border);padding:0 42px 0 14px;font-size:14px;background:var(--surface-2);}
input:focus{outline:none;border-color:var(--primary-light);background:var(--surface);}
.toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;}
.hint{font-size:11.5px;color:var(--faint);margin-top:6px;}
.msg{padding:11px 14px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:18px;display:none;}
.msg.error{background:var(--danger-bg);color:var(--danger);display:block;}
.msg.success{background:var(--success-bg);color:var(--success);display:block;}
button.submit{width:100%;height:48px;margin-top:26px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
button.submit:hover{background:var(--primary-dark);}
button.submit:disabled{opacity:.6;cursor:not-allowed;}
.footnote{text-align:center;margin-top:18px;font-size:12px;color:var(--faint);}
</style>
</head>
<body>
<div class="card">
<div class="mark">RM</div>
<h1>Set a new password</h1>
<p class="subtitle">This is your first login (or an admin reset your password). You need to set a personal password before you can continue.</p>

<div class="user-chip"><i class="fa fa-user"></i> <strong id="userLabel">&mdash;</strong></div>

<div id="msgBox" class="msg"></div>

<form id="changeForm">
<label>Current (temporary) password</label>
<div class="input-wrap">
<input type="password" id="currentPassword" required autocomplete="current-password">
<button type="button" class="toggle-eye" onclick="toggleField('currentPassword', this)"><i class="fa fa-eye"></i></button>
</div>

<label>New password</label>
<div class="input-wrap">
<input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
<button type="button" class="toggle-eye" onclick="toggleField('newPassword', this)"><i class="fa fa-eye"></i></button>
</div>
<div class="hint">At least 8 characters.</div>

<label>Confirm new password</label>
<div class="input-wrap">
<input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
<button type="button" class="toggle-eye" onclick="toggleField('confirmPassword', this)"><i class="fa fa-eye"></i></button>
</div>

<button type="submit" class="submit" id="submitBtn">Set password and continue</button>
</form>

<p class="footnote">You won't be able to access your dashboard until this is done.</p>
</div>

<script>
const API = "http://localhost:3000/api";
const token = localStorage.getItem("token") || localStorage.getItem("reframe_token");

if (!token) window.location.href = "login.html";

function toggleField(id, btn) {
  const el = document.getElementById(id);
  const icon = btn.querySelector("i");
  if (el.type === "password") { el.type = "text"; icon.className = "fa fa-eye-slash"; }
  else { el.type = "password"; icon.className = "fa fa-eye"; }
}

function showMsg(text, type) {
  const box = document.getElementById("msgBox");
  box.textContent = text;
  box.className = "msg " + type;
}

function destinationForRole(role) {
  if (role === "admin") return "AdminDashboard.html";
  if (role === "supervisor") return "supervisor-dashboard.html";
  return "PersonalProfile.html";
}

let currentRole = "trainee";

async function loadMe() {
  try {
    const res = await fetch(API + "/profile/me", { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 401) { window.location.href = "login.html"; return; }
    const data = await res.json();
    currentRole = data.role;
    document.getElementById("userLabel").textContent = `${data.full_name} (${data.memberCode})`;

    // Already changed their password? Nothing to do here -- send them onward.
    if (!data.must_change_password) {
      window.location.href = destinationForRole(data.role);
    }
  } catch (err) {
    showMsg("Could not reach the server. Make sure the backend is running on port 3000.", "error");
  }
}

document.getElementById("changeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById("currentPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (newPassword !== confirmPassword) {
    showMsg("New password and confirmation don't match.", "error");
    return;
  }
  if (newPassword.length < 8) {
    showMsg("New password must be at least 8 characters.", "error");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Saving...";

  try {
    const res = await fetch(API + "/profile/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    const data = await res.json().catch(() => null);

    if (!res.ok) {
      showMsg(data?.error || "Could not change password.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Set password and continue";
      return;
    }

    showMsg("Password updated. Redirecting...", "success");
    setTimeout(() => { window.location.href = destinationForRole(currentRole); }, 700);
  } catch (err) {
    showMsg("Could not reach the server. Make sure the backend is running on port 3000.", "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Set password and continue";
  }
});

loadMe();
</script>
</body>
</html>
