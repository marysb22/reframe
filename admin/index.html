<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reframe CMS</title>

    

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body>
    <script src="https://unpkg.com/decap-cms@3.10.0/dist/decap-cms.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init();

        window.netlifyIdentity.on("init", (user) => {
          const hash = window.location.hash || "";

          if (!user && hash.includes("recovery_token")) {
            window.netlifyIdentity.open("recovery");
          }

          if (!user && hash.includes("invite_token")) {
            window.netlifyIdentity.open("signup");
          }
        });

        window.netlifyIdentity.on("login", () => {
          Twindow.location.href = "/admin/";
        });

        window.netlifyIdentity.on("logout", () => {
          window.location.href = "/admin/";
        });

        
        if (typeof window.netlifyIdentity.handleAuthCallback === "function") {
          window.netlifyIdentity.handleAuthCallback();
        }
      }
    </script>
  </body>
</html>
