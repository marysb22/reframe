backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "All Events"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.english.title}} / {{fields.arabic.title}}"
            fields:
              - label: "Date"
                name: "date"
                widget: "datetime"

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Register Link"
                name: "register"
                widget: "string"
                required: false
                default: "#"

              - label: "Fee"
                name: "fee"
                widget: "string"
                required: false

              - label: "المحتوى العربي"
                name: "arabic"
                widget: "object"
                fields:
                  - label: "العنوان"
                    name: "title"
                    widget: "string"
                    required: true

                  - label: "الصيغة"
                    name: "format"
                    widget: "string"
                    required: false

                  - label: "الميسّر"
                    name: "facilitator"
                    widget: "string"
                    required: false

                  - label: "الوصف"
                    name: "about"
                    widget: "text"
                    required: false

                  - label: "ماذا ستتعلّم"
                    name: "learn"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "أضف نقطة"
                      name: "item"
                      widget: "string"

                  - label: "من ينبغي أن يحضر؟"
                    name: "who"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "أضف فئة"
                      name: "item"
                      widget: "string"

                  - label: "نتائج الورشة"
                    name: "outcomes"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "أضف نتيجة"
                      name: "item"
                      widget: "string"

                  - label: "نبذة عن الميسّر"
                    name: "facilitatorBio"
                    widget: "text"
                    required: false

              - label: "English Content"
                name: "english"
                widget: "object"
                fields:
                  - label: "Title"
                    name: "title"
                    widget: "string"
                    required: true

                  - label: "Format"
                    name: "format"
                    widget: "string"
                    required: false

                  - label: "Facilitator"
                    name: "facilitator"
                    widget: "string"
                    required: false

                  - label: "About"
                    name: "about"
                    widget: "text"
                    required: false

                  - label: "What You'll Learn"
                    name: "learn"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one point"
                      name: "item"
                      widget: "string"

                  - label: "Who Should Attend?"
                    name: "who"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one person/group"
                      name: "item"
                      widget: "string"

                  - label: "Workshop Outcomes"
                    name: "outcomes"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one outcome"
                      name: "item"
                      widget: "string"

                  - label: "Facilitator Bio"
                    name: "facilitatorBio"
                    widget: "text"
                    required: false