backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "All Events"
        file: "content/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.english.title}} / {{fields.arabic.title}}"
            fields:
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["upcoming", "concluded"]
                default: "upcoming"

              - label: "Date"
                name: "date"
                widget: "datetime"

              - label: "Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Register Link"
                name: "register"
                widget: "string"
                required: false
                default: "#"

              - label: "Arabic Content"
                name: "arabic"
                widget: "object"
                fields:
                  - { label: "Title (Arabic)", name: "title", widget: "string", required: true }
                  - { label: "Format (Arabic)", name: "format", widget: "string", required: false }
                  - { label: "Facilitator (Arabic)", name: "facilitator", widget: "string", required: false }
                  - { label: "About (Arabic)", name: "about", widget: "text", required: false }

                  - label: "What You'll Learn (Arabic)"
                    name: "learn"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one point"
                      name: "item"
                      widget: "string"

                  - label: "Who Should Attend? (Arabic)"
                    name: "who"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one person/group"
                      name: "item"
                      widget: "string"

                  - label: "Workshop Outcomes (Arabic)"
                    name: "outcomes"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one outcome"
                      name: "item"
                      widget: "string"

                  - { label: "Facilitator Bio (Arabic)", name: "facilitatorBio", widget: "text", required: false }
                  - { label: "Fee (Arabic)", name: "fee", widget: "string", required: false }

              - label: "English Content"
                name: "english"
                widget: "object"
                fields:
                  - { label: "Title (English)", name: "title", widget: "string", required: true }
                  - { label: "Format (English)", name: "format", widget: "string", required: false }
                  - { label: "Facilitator (English)", name: "facilitator", widget: "string", required: false }
                  - { label: "About (English)", name: "about", widget: "text", required: false }

                  - label: "What You'll Learn (English)"
                    name: "learn"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one point"
                      name: "item"
                      widget: "string"

                  - label: "Who Should Attend? (English)"
                    name: "who"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one person/group"
                      name: "item"
                      widget: "string"

                  - label: "Workshop Outcomes (English)"
                    name: "outcomes"
                    widget: "list"
                    required: false
                    allow_add: true
                    collapsed: false
                    field:
                      label: "Add one outcome"
                      name: "item"
                      widget: "string"

                  - { label: "Facilitator Bio (English)", name: "facilitatorBio", widget: "text", required: false }
                  - { label: "Fee (English)", name: "fee", widget: "string", required: false }  